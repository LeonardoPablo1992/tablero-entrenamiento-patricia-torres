<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martha Patricia Torres Gómez — Plan de Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  
  :root{ --bg:#ffffff; --bg-2:#f3fbf7; --panel:#ffffff; --panel-2:#eef8f2; --stripe:#fafdfb; --border:#cfe9db; --border-soft:#e4f3ea; --text:#10231a; --text-dim:#55675e; --text-faint:#8a9a91; --jade:#00a86b; --jade-deep:#08804f; --jade-ink:#0a4f39; --jade-soft:#e3f6ec; --mint:#9fdcbd; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Red Hat Display', Arial, Helvetica, sans-serif;
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  @media (max-width:600px){.wrap{padding:0 16px;}}

  header.top{
    background:linear-gradient(180deg,#d6f2e5 0%, var(--bg) 100%);
    border-bottom:1px solid var(--border);
    padding:36px 0 0 0;
  }
  .brand-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;padding-bottom:24px;}
  .brand-title{font-weight:900;font-size:clamp(28px,4vw,44px);letter-spacing:.5px;text-transform:uppercase;color:var(--jade-ink);margin:0;}
  .brand-sub{color:var(--text-dim);font-weight:500;font-size:14px;margin-top:4px;letter-spacing:.3px;}
  .brand-tag{
    font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--jade-deep);font-weight:700;
    border:1px solid var(--mint);background:rgba(255,255,255,.6);padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  .kpis{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:24px;}
  .kpi{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:10px 16px;min-width:120px;
    animation:kpi-in .45s ease both;transition:transform .15s ease,border-color .15s ease;
  }
  .kpi:hover{transform:translateY(-2px);border-color:var(--mint);}
  .kpi .k-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);font-weight:700;}
  .kpi .k-value{font-size:17px;font-weight:800;color:var(--jade-ink);margin-top:3px;}
  @keyframes kpi-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  nav.tabs{
    display:flex;overflow-x:auto;border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:50;scrollbar-width:thin;
  }
  nav.tabs .tab-inner{display:flex;gap:4px;padding:0 20px;max-width:1180px;margin:0 auto;width:100%;}
  nav.tabs button{
    appearance:none;background:transparent;border:none;color:var(--text-dim);font-family:inherit;
    font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:14px 16px;cursor:pointer;
    white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s ease,border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--jade-deep);}
  nav.tabs button.active{color:var(--jade-ink);border-bottom-color:var(--jade);}
  nav.tabs button .tab-done{display:inline-block;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--jade-soft);color:var(--jade-deep);vertical-align:1px;}

  main.wrap{padding-top:28px;padding-bottom:60px;min-height:50vh;}
  .tab-done[hidden]{display:none !important;}
  .table-scroll table.fluid{min-width:0;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .section-title{font-size:20px;font-weight:800;color:var(--jade-ink);margin:0 0 4px 0;letter-spacing:.2px;}
  .section-desc{color:var(--text-dim);font-size:13.5px;margin:0 0 18px 0;max-width:760px;}
  .section-desc b{color:var(--text);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media (max-width:860px){.grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 10px 24px rgba(11,122,85,.08);}
  .card h3{margin:0 0 4px 0;font-size:14px;color:var(--jade-ink);font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .card p{margin:0;color:var(--text-dim);font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    background:var(--panel-2);color:var(--jade-ink);text-transform:uppercase;font-size:10.5px;letter-spacing:.8px;
    font-weight:800;padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle;}
  tbody tr:nth-child(even){background:var(--stripe);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.cat-row td{
    background:var(--panel-2);color:var(--jade-ink);font-weight:800;text-transform:uppercase;font-size:11px;
    letter-spacing:1px;padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  }
  .muted{color:var(--text-faint);}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border-soft);border-radius:12px;background:var(--panel);}
  .table-scroll table{min-width:640px;}

  .chip-total{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-dim);
  }
  .chip-total b{color:var(--jade-ink);font-size:14px;}
  .totals-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px 0;}
  .phase-pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--jade-deep);background:var(--jade-soft);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:4px;}

  .chart-box{background:var(--stripe);border:1px solid var(--border-soft);border-radius:12px;padding:16px;height:260px;}
  .bars{display:flex;align-items:stretch;justify-content:space-around;gap:12px;height:228px;}
  .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;min-width:0;}
  .bar-track{display:flex;align-items:flex-end;width:100%;max-width:56px;height:180px;}
  .bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:4px;position:relative;display:flex;justify-content:center;transition:height .5s cubic-bezier(.2,.8,.2,1);}
  .bar-value{position:absolute;top:-22px;font-size:12px;font-weight:800;color:var(--jade-ink);}
  .bar-label{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--text-dim);text-align:center;line-height:1.2;}
  .legend-note{font-size:12px;color:var(--text-faint);margin-top:10px;}
  .legend-note b{color:var(--text-dim);}

  .cat-block-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--jade-deep);margin:20px 0 10px 0;}
  .cat-block-label:first-child{margin-top:0;}

  /* exercise rows */
  tbody tr.ex-row{transition:background .15s ease;}
  tbody tr.ex-row:hover{background:var(--panel-2);}
  tbody tr.ex-row.done{background:#e6f7ef;}
  tbody tr.ex-row.done .ex-name{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--jade);}
  .combo-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:6px;
    background:var(--panel-2);border:1px solid var(--border);font-size:11px;font-weight:800;color:var(--jade-deep);padding:0 6px;
  }
  .ex-name{font-weight:700;color:var(--text);}
  .ex-check-cell{width:40px;}
  .ex-check{
    appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;
    width:22px;height:22px;border-radius:50%;border:2px solid var(--mint);background:#fff;
    display:inline-grid;place-content:center;vertical-align:middle;transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .ex-check:hover{border-color:var(--jade);transform:scale(1.08);}
  .ex-check::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s ease;}
  .ex-check:checked{background:var(--jade);border-color:var(--jade);}
  .ex-check:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1);}
  .ex-check:focus-visible{outline:2px solid var(--jade-deep);outline-offset:2px;}
  .sets-pips{display:flex;gap:5px;flex-wrap:wrap;max-width:190px;}
  .pip{
    appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;width:14px;height:14px;border-radius:50%;
    border:1.5px solid var(--mint);background:#fff;transition:background .12s ease,border-color .12s ease,transform .12s ease;
  }
  .pip:hover{transform:scale(1.15);border-color:var(--jade);}
  .pip:checked{background:var(--jade);border-color:var(--jade);}
  .pip:focus-visible{outline:2px solid var(--jade-deep);outline-offset:2px;}
  .setsreps{font-weight:800;color:var(--jade-ink);font-size:14px;}

  .check-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 0 0;font-size:12.5px;color:var(--text-dim);}
  .check-bar b{color:var(--jade-ink);}
  .progress{flex:1;min-width:160px;max-width:320px;height:10px;background:var(--jade-soft);border-radius:999px;overflow:hidden;}
  .progress > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--jade));border-radius:999px;transition:width .35s ease;}
  .check-reset{background:#fff;border:1px solid var(--border);color:var(--text-dim);border-radius:999px;padding:5px 12px;font:inherit;font-size:11.5px;cursor:pointer;}
  .check-reset:hover{border-color:var(--jade);color:var(--jade-deep);}
  .done-banner{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--jade-soft);color:var(--jade-ink);font-weight:700;font-size:13px;}
  .panel.all-done .done-banner{display:block;animation:fade .3s ease;}

  .meal-supl{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--jade-deep);background:var(--panel-2);border-radius:6px;padding:2px 8px;}

  footer.site{border-top:1px solid var(--border);background:#dff3e9;padding:26px 0;text-align:center;}
  footer.site .foot-name{font-weight:800;color:var(--jade-ink);letter-spacing:.5px;font-size:15px;}
  footer.site .foot-sub{color:var(--text-faint);font-size:12px;margin-top:4px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--mint);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  button,input,select,textarea{font-family:'Red Hat Display', Arial, Helvetica, sans-serif;}
  .grid-2>*{min-width:0;}
  @media (max-width:600px){.bars{gap:6px;}.bar-label{font-size:10px;}.card{padding:16px 14px;}}
  .month-switch{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--border);margin-bottom:22px;}
  .month-switch button{appearance:none;border:none;background:transparent;color:var(--text-dim);font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;padding:9px 20px;border-radius:999px;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .month-switch button:hover{color:var(--jade-deep);}
  .month-switch button.on{background:var(--jade);color:#fff;}
  .month-switch button:not(.on) .m-tag{background:var(--jade-soft);color:var(--jade-deep);}
  .month-switch button .m-tag{display:inline-block;margin-left:6px;font-size:9.5px;letter-spacing:.8px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.25);vertical-align:1px;}
  .month-note{font-size:12.5px;color:var(--text-dim);margin:-10px 0 22px 0;}
  .day-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px 0;}
  .day-chips button{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;}
  .day-chips button.on{background:var(--jade);border-color:var(--jade);color:#fff;}
  .meal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .meal-card h4{margin:0 0 2px 0;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);font-weight:800;}
  .meal-card .meal-title{font-size:15px;font-weight:800;color:var(--jade-ink);margin:0 0 8px 0;}
  .meal-card ul,.list-card ul{margin:0;padding-left:18px;color:var(--text);font-size:13px;}
  .meal-card li,.list-card li{margin:3px 0;}
  .list-card{margin-bottom:18px;}
  .list-card ul.cols{columns:2;column-gap:28px;}
  @media (max-width:600px){.list-card ul.cols{columns:1;}}
  .nut-meta{font-size:12.5px;color:var(--text-faint);margin:-8px 0 18px 0;}
  .day-sub{color:var(--text-faint);font-weight:600;}
  .warn-note{margin-top:10px;font-size:12px;color:#8a5a00;background:#fff6dd;border:1px solid #f1dfa6;border-radius:8px;padding:8px 12px;}

/* ===== ProTrainerPlus · capa de diseño (blanco, líneas verdes, botones redondos verde claro) ===== */
:root{--ptp-bg:#ffffff;--ptp-alt:#f6faf8;--ptp-line:#cfe9db;--ptp-line-soft:#e4f3ea;--ptp-green:#00a86b;--ptp-deep:#08804f;--ptp-ink:#0a4f39;--ptp-soft:#e3f6ec;--ptp-mint:#9fdcbd;--ptp-btn:#a8ecc8;--ptp-btn-h:#8be3b5;--ptp-text:#10231a;--ptp-dim:#55675e;--ptp-shadow:0 1px 2px rgba(10,79,57,.05),0 8px 24px -12px rgba(10,79,57,.18)}
html,body{background:#fff!important}
body{font-family:"Red Hat Display",system-ui,sans-serif!important;color:var(--ptp-text)}
body *{font-family:"Red Hat Display",system-ui,sans-serif!important}

/* encabezados con líneas verdes animadas */
header.top,header.topbar,.ptp-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#f3fbf7 0,#fff 100%)!important;border-bottom:1px solid var(--ptp-line)!important;color:var(--ptp-text)!important}
header.top>*,header.topbar>*{position:relative;z-index:1}
.hdr-lines{position:absolute!important;inset:0;width:100%;height:100%;pointer-events:none;z-index:0!important}
.hdr-lines path{fill:none;stroke:var(--ptp-green);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:6 10;animation:ptpflow 14s linear infinite}
.hdr-lines path:nth-child(2){stroke:var(--ptp-mint);stroke-dasharray:none;stroke-width:1.5;animation:ptpsway 9s ease-in-out infinite alternate}
.hdr-lines path:nth-child(3){stroke-dasharray:2 8;animation-duration:22s;opacity:.6}
@keyframes ptpflow{to{stroke-dashoffset:-320}}
@keyframes ptpsway{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
.brand-title,.brand h1,.plan-title{font-family:"Red Hat Display",system-ui,sans-serif!important;font-weight:600!important;letter-spacing:-.6px!important;text-transform:none!important;color:var(--ptp-text)!important}
.brand-sub,.brand p{color:var(--ptp-dim)!important;opacity:1!important}
.brand-tag,.athlete-chip,.week-chip{background:#fff!important;color:var(--ptp-ink)!important;border:1px solid var(--ptp-line)!important;border-radius:999px!important;letter-spacing:.2px!important;text-transform:none!important;font-size:12.5px!important;font-weight:600!important}
.brand-watermark{opacity:.08!important}

/* indicadores */
.kpi,.kpi-card,.objective-card,.totals-card{background:#fff!important;border:1px solid var(--ptp-line)!important;border-radius:18px!important;box-shadow:var(--ptp-shadow)!important}
.kpi{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px!important}
.kpi .k-ico{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--ptp-soft);display:grid;place-items:center;color:var(--ptp-deep)}
.kpi .k-label,.kpi-card .label{text-transform:none!important;letter-spacing:0!important;font-size:12px!important;color:var(--ptp-dim)!important;font-weight:500!important}
.kpi .k-value,.kpi-card .value{color:var(--ptp-text)!important}

/* pestañas: píldoras */
nav.tabs,.tabs{background:rgba(255,255,255,.95)!important;backdrop-filter:blur(10px);border-bottom:1px solid var(--ptp-line)!important;scrollbar-width:none}
nav.tabs .tab-inner{gap:8px!important;padding-top:12px!important;padding-bottom:12px!important}
header.topbar nav.tabs{background:transparent!important;border-bottom:none!important;padding:6px 0 16px;gap:8px!important}
nav.tabs button,.tab-btn{display:inline-flex!important;align-items:center;gap:8px;background:#fff!important;border:1px solid var(--ptp-line)!important;color:var(--ptp-dim)!important;opacity:1!important;font-family:"Red Hat Display",system-ui,sans-serif!important;font-size:14px!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;padding:9px 18px!important;border-radius:999px!important;margin:0!important;transition:background .15s,color .15s,border-color .15s}
nav.tabs button:hover,.tab-btn:hover{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;border-color:var(--ptp-mint)!important}
nav.tabs button.active,.tab-btn[aria-selected="true"]{background:var(--ptp-btn)!important;border-color:var(--ptp-btn)!important;color:#06402b!important;font-weight:600!important;box-shadow:0 6px 16px -10px rgba(0,168,107,.8)}
.tab-btn[aria-selected="true"]::after{display:none!important}
.tabs{display:flex;gap:8px!important;padding:10px 2px 12px!important}
nav.tabs button .tab-done{background:var(--ptp-green)!important;color:#fff!important;border-radius:50%!important}

/* títulos y tarjetas */
.section-title,h2.section-title{color:var(--ptp-text)!important;font-weight:600!important;letter-spacing:-.3px!important;text-transform:none!important;display:flex;align-items:center;gap:10px}
.section-title:before,h2.section-title:before{content:"";width:4px;height:20px;border-radius:4px;background:var(--ptp-green);flex:0 0 auto}
.card,.meal-card,.list-card,.ex-card,.chart-box{background:#fff!important;border:1px solid var(--ptp-line)!important;border-radius:18px!important;box-shadow:var(--ptp-shadow)!important}
.card:hover{transform:none!important}
.card h3,h3.card-title,.meal-card h4{color:var(--ptp-text)!important;text-transform:none!important;letter-spacing:-.1px!important;font-weight:600!important;display:flex;align-items:center;gap:8px}
.cat-block-label{color:var(--ptp-deep)!important;text-transform:none!important;letter-spacing:.1px!important;font-weight:700!important;display:flex;align-items:center;gap:10px}
.cat-block-label:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ptp-mint),transparent)}
.table-scroll{border:1px solid var(--ptp-line)!important;border-radius:18px!important;background:#fff!important;box-shadow:var(--ptp-shadow)}
thead th,table.data-table th{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;text-transform:none!important;letter-spacing:0!important;font-size:12.5px!important;border-bottom:1px solid var(--ptp-line)!important}
tbody tr.cat-row td{background:var(--ptp-soft)!important;color:var(--ptp-ink)!important;text-transform:none!important;letter-spacing:0!important}

/* botones verdes claros y redondos */
button,.check-reset,.filter-btn,.phase-btn,.week-pill,.month-switch button,.day-chips button{border-radius:999px!important}
.check-reset,.filter-btn,.month-switch button,.day-chips button,.phase-btn{background:#fff!important;border:1px solid var(--ptp-mint)!important;color:var(--ptp-ink)!important;font-family:inherit!important;font-weight:600!important;cursor:pointer;transition:background .15s,transform .15s}
.check-reset:hover,.filter-btn:hover,.month-switch button:hover,.day-chips button:hover,.phase-btn:hover{background:var(--ptp-soft)!important;transform:translateY(-1px)}
.filter-btn.active,.month-switch button.on,.day-chips button.on,.phase-btn.active,.week-pill.active{background:var(--ptp-btn)!important;border-color:var(--ptp-btn)!important;color:#06402b!important}
.week-pill{background:#fff!important;border:1px solid var(--ptp-line)!important;color:var(--ptp-text)!important}
.week-pill.active .wp-sub,.week-pill.active .wp-series{color:#06402b!important}
.phase-btn{padding:10px 18px!important;text-align:left}
.month-switch{border-radius:999px!important}

/* casillas redondas */
.ex-check{border-radius:50%!important;border-color:var(--ptp-mint)!important;background:#fff!important}
.ex-check:checked{background:var(--ptp-green)!important;border-color:var(--ptp-green)!important}
.ex-check::after{border-color:#fff!important}
.pip{border-radius:50%!important;border-color:var(--ptp-mint)!important}
.pip:checked{background:var(--ptp-green)!important;border-color:var(--ptp-green)!important}
input[type="checkbox"]{border-radius:50%!important}

function animateCounts(scope){
  scope.querySelectorAll('[data-count]').forEach(el=>{
    const raw = el.dataset.count, m = raw.match(/^(\d[\d,]*)$/);
    if(!m) return;
    const target = parseFloat(m[1].replace(/,/g,'')), dur = 600, t0 = performance.now();
    (function tick(now){ const p = Math.min(1,(now-t0)/dur); el.textContent = Math.round(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(tick); else el.textContent = raw; })(t0);

}

  </div>
  <div class="card"><h3>Cómo leer el plan</h3>
    <p><b>Combinación</b>: ejercicios con la misma letra se hacen en superserie. <b>Tempo</b>: excéntrica–pausa–concéntrica en segundos. <b>RIR</b>: repeticiones en reserva al terminar la serie. <b>Descanso</b>: tiempo entre series (40" = 40 segundos, 1' = 1 minuto). Los puntos pequeños marcan cada serie; el círculo grande marca el ejercicio completo.</p></div>`;
}

/* ---------- Nutrición (menú por día) ---------- */
function renderNutricion(){
  const n = MD.nutrition, meta = n.meta;
  return `
  <h2 class="section-title">Plan de alimentación · ${MD.label}</h2>
  <p class="nut-meta">Elaborado por <b>${esc(meta.profesional)}</b> · ${esc(meta.cedula)} · ${esc(meta.fecha)}</p>
  <p class="section-desc">Menú de 6 días con 4 comidas. Elige el día y sigue las cantidades indicadas. Las colaciones son opcionales, solo si hay hambre entre comidas.</p>
  <div class="day-chips" id="foodChips">${n.meals_by_day.map(d=>`<button type="button" data-food="${d.dia}" class="${d.dia===foodDay?'on':''}">Día ${d.dia}</button>`).join('')}</div>
  <div class="meal-grid" id="mealGrid">${mealCards(foodDay)}</div>
  <div class="card list-card"><h3>Colaciones</h3><p style="margin-bottom:10px;">${esc(n.colaciones_nota)}</p>
    <ul class="cols">${n.colaciones.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
  <div class="grid-2">
    <div class="card list-card"><h3>Recomendaciones</h3><ul>${n.recomendaciones.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
    <div><div class="card list-card"><h3>Metas</h3><ul>${n.metas.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
      <div class="card list-card"><h3>Medidas</h3><ul>${n.medidas.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div>
  </div>`;
}
function mealCards(dia){
  const d = MD.nutrition.meals_by_day.find(x=>x.dia===dia) || MD.nutrition.meals_by_day[0];
  return MEAL_KEYS.map(([k,l])=>{ const m = d[k]; if(!m) return '';
    return `<div class="card meal-card"><h4>${l}</h4><p class="meal-title">${esc(m.titulo)}</p><ul>${m.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`; }).join('');
}

/* ---------- Día de entrenamiento ---------- */
function exRow(dayKey, r, i){
  const k = rowKey(dayKey, i), st = state[k] || {};
  const n = Math.max(0, Math.min(+r.sets||0, 24));
  const pips = Array.from({length:n},(_,s)=>`<input type="checkbox" class="pip" data-row="${k}" data-set="${s}" aria-label="Serie ${s+1} de ${esc(r.name)}" ${st.s&&st.s[s]?'checked':''}>`).join('');
  return `<tr class="ex-row${st.done?' done':''}" data-row="${k}">
    <td class="ex-check-cell"><input type="checkbox" class="ex-check" data-row="${k}" aria-label="Marcar ${esc(r.name)} como realizado" ${st.done?'checked':''}></td>
    <td><span class="combo-badge">${r.combo||'·'}</span></td>
    <td><span class="ex-name">${esc(r.name)}</span></td>
    <td class="num"><span class="setsreps">${r.sets??'—'} × ${r.reps??'—'}</span></td>
    <td><div class="sets-pips">${pips}</div></td>
    <td class="num">${r.tempo||'—'}</td><td class="num">${r.rir??'—'}</td><td class="num">${r.rest||'—'}</td></tr>`;
}
function renderDay(k){
  const d = MD.days[k]; let tables = '';
  ['rz','pr','ac'].forEach(cat=>{
    const rows = d.rows.map((r,i)=>[r,i]).filter(([r])=>r.cat===cat); if(!rows.length) return;
    tables += `<div class="cat-block-label">${CAT_LABEL[cat]} · ${daySeries(k,cat)} series</div>
    <div class="table-scroll" style="margin-bottom:8px;"><table>
      <thead><tr><th>✓</th><th></th><th>Ejercicio</th><th>Series × reps</th><th>Series hechas</th><th>Tempo</th><th>RIR</th><th>Descanso</th></tr></thead>
      <tbody>${rows.map(([r,i])=>exRow(k,r,i)).join('')}</tbody></table></div>`;
  });
  return `
  <h2 class="section-title">${d.label}</h2>
  <p class="section-desc">${d.sub?`<span class="day-sub">${esc(d.sub)}.</span> `:''}${MD.intensidad?`Intensidad: <b>${MD.intensidad}</b>. `:''}${d.rows.length} ejercicios · ${daySeries(k)} series en total. Marca los puntos de cada serie o el círculo del ejercicio completo.</p>
  ${d.note?`<div class="warn-note">${esc(d.note)}</div>`:''}
  <div class="check-bar"><span>Realizados <b class="cnt">0</b> / ${d.rows.length}</span><div class="progress"><span></span></div>
    <button type="button" class="check-reset">Reiniciar marcas</button></div>
  <div class="done-banner">¡Sesión completa! Buen trabajo 💪</div>
  <div style="margin:18px 0 24px 0;">${tables}</div>
  <div class="card"><h3>Series por bloque</h3><div class="chart-box"><div class="bars" id="chart-${slug(k)}"></div></div></div>`;
}

/* ---------- interacciones ---------- */
function onChange(e){
  const el = e.target, k = el.dataset.row; if(!k) return;
  const [dayKey, idx] = [k.split('::')[0], +k.split('::')[1]];
  const n = +MD.days[dayKey].rows[idx].sets || 0;
  const st = state[k] || (state[k] = {s:{}}); st.s = st.s || {};
  const tr = el.closest('tr');
  if(el.classList.contains('pip')){
    if(el.checked) st.s[el.dataset.set] = 1; else delete st.s[el.dataset.set];
    st.done = Object.keys(st.s).length >= n && n>0; tr.querySelector('.ex-check').checked = st.done;
  } else {
    st.done = el.checked; st.s = {};
    tr.querySelectorAll('.pip').forEach((p,s)=>{ p.checked = el.checked; if(el.checked) st.s[s]=1; });
  }
  if(!st.done && !Object.keys(st.s).length) delete state[k];
  tr.classList.toggle('done', !!st.done); save(); updateProgress();
}
function onClick(e){
  const t = e.target;
  if(t.classList.contains('check-reset')){
    t.closest('.panel').querySelectorAll('tr.ex-row').forEach(tr=>{ delete state[tr.dataset.row]; tr.classList.remove('done'); tr.querySelectorAll('input').forEach(i=> i.checked=false); });
    save(); updateProgress();
  }
  if(t.dataset.food){
    foodDay = +t.dataset.food; lsSet(PREF+'-food-'+M, foodDay);
    document.querySelectorAll('#foodChips button').forEach(b=> b.classList.toggle('on', b===t));
    document.getElementById('mealGrid').innerHTML = mealCards(foodDay);
  }
}
function updateProgress(){
  DAY_KEYS.forEach(k=>{
    const id = 'd-'+slug(k), panel = document.getElementById('panel-'+id); if(!panel) return;
    const total = MD.days[k].rows.length, done = MD.days[k].rows.filter((_,i)=> state[rowKey(k,i)] && state[rowKey(k,i)].done).length;
    const pct = Math.round(done/total*100);
    panel.querySelector('.cnt').textContent = done; panel.querySelector('.progress > span').style.width = pct+'%';
    panel.classList.toggle('all-done', done===total);
    const tab = document.querySelector(`nav.tabs button[data-tab="${id}"] .tab-done`); if(tab) tab.hidden = done!==total;
    const cell = document.querySelector(`[data-prog="${slug(k)}"]`); if(cell) cell.textContent = pct+'%';
  });
}

/* ---------- gráficas ---------- */
const BAR = ['#8fd9b8','#00a86b','#0b7a55','#5cc79b','#36b884'];
function barChart(id, labels, values){
  const el = document.getElementById(id); if(!el) return;
  const max = Math.max(1, ...values);
  el.innerHTML = labels.map((l,i)=>`<div class="bar-col"><div class="bar-track"><div class="bar-fill" style="height:0;background:${BAR[i%BAR.length]};" data-h="${Math.round(values[i]/max*100)}"><span class="bar-value">${values[i]}</span></div></div><div class="bar-label">${l}</div></div>`).join('');
  requestAnimationFrame(()=> el.querySelectorAll('.bar-fill').forEach(b=> b.style.height = b.dataset.h+'%'));
}
function renderCharts(id){
  if(id==='resumen') barChart('chart-resumen', DAY_KEYS.map(k=>MD.days[k].label), DAY_KEYS.map(k=>daySeries(k)));
  else if(id.startsWith('d-')){ const k = DAY_KEYS.find(x=>'d-'+slug(x)===id);
    const cats = ['rz','pr','ac'].filter(c=>daySeries(k,c)>0);
    barChart('chart-'+slug(k), cats.map(c=>({rz:'Rezagado',pr:'Principal',ac:'Complem.'}[c])), cats.map(c=>daySeries(k,c))); }
}

/* ---------- mes ---------- */
function buildMonthSwitch(){
  document.getElementById('monthSwitch').innerHTML = MONTHS.map(m=>`<button type="button" data-month="${m}" class="${m===M?'on':''}">${DATA.months[m].label}${m==='nov'?'<span class="m-tag">Actual</span>':''}</button>`).join('');
  document.querySelectorAll('#monthSwitch button').forEach(b=> b.onclick = ()=> setMonth(b.dataset.month));
}
function setMonth(m){
  M = DATA.months[m] ? m : 'nov'; MD = DATA.months[M]; DAY_KEYS = Object.keys(MD.days);
  try{ state = JSON.parse(lsGet(MD.store,'{}')) || {}; }catch(e){ state = {}; }
  foodDay = +lsGet(PREF+'-food-'+M, 1) || 1;
  lsSet(PREF+'-month', M);
  buildMonthSwitch();
  document.getElementById('monthNote').textContent = M==='nov' ? '' : 'Estás viendo tu plan anterior. Tu plan actual es Noviembre.';
  document.getElementById('monthNote').hidden = M==='nov';
  buildKpis();
  let html = `<div class="panel" id="panel-resumen">${renderResumen()}</div><div class="panel" id="panel-nutricion">${renderNutricion()}</div>`;
  DAY_KEYS.forEach(k=>{ html += `<div class="panel" id="panel-d-${slug(k)}">${renderDay(k)}</div>`; });
  document.getElementById('mainContent').innerHTML = html;
  const tab = lsGet(PREF+'-tab-'+M, 'resumen');
  buildTabs(tab); updateProgress(); activateTab(tab);
}

const main = document.getElementById('mainContent');
main.addEventListener('change', onChange);
main.addEventListener('click', onClick);
setMonth(lsGet(PREF+'-month','nov'));
</script>
<script>
/* ===== ProTrainerPlus · íconos animados, líneas verdes y secciones desplegables (página de plan) ===== */
(function(){
  const P={
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    clip:'<rect x="8" y="2.5" width="8" height="4" rx="1.5"/><path d="M16 4.5h2a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
    apple:'<path d="M12 7.5c-2-2-6.2-1.4-6.6 2.6C5 14 7 19 9.5 20.4c1 .6 1.8 0 2.5 0s1.5.6 2.5 0C17 19 19 14 18.6 10.1 18.2 6.1 14 5.5 12 7.5z"/><path d="M12 7.5c0-2 1-3.6 3-4.5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/>',
    userplus:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M19 8v6M16 11h6"/>',
    layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
    pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    dumbbell:'<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 1.5 2 2.5 2 0-2.5-.5-4.5.5-7z"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
    chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
    camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>',
    key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>'
  };
  const svg=(k,cls)=>`<svg class="ico${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true">${P[k]||P.dumbbell}</svg>`;
  const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  function pick(label,fallback){
    const t=norm(label);
    if(/nueva|alta|agregar/.test(t))return"userplus";
    if(/resumen|inicio/.test(t))return"home";
    if(/cuenta|perfil/.test(t))return"user";
    if(/funciona|ayuda/.test(t))return"layers";
    if(/seguimiento/.test(t))return"chat";
    if(/planes/.test(t))return"layers";
    if(/nutri|dieta|comida|menu|aliment/.test(t))return"apple";
    if(/historial/.test(t))return"clock";
    if(/registr|sesion de hoy|hoy/.test(t))return"check";
    if(/atleta|cliente/.test(t))return"users";
    if(/actividad|feed/.test(t))return"pulse";
    if(/progres|evoluc/.test(t))return"trend";
    if(/mi plan|plan/.test(t))return"clip";
    if(/semana|sesion|fecha|dia|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|mes/.test(t))return"cal";
    if(/kcal|calor|racha/.test(t))return"flame";
    if(/%|avance|cumpl|progreso|meta/.test(t))return"target";
    if(/foto|evidencia/.test(t))return"camera";
    if(/coment|mensaje|nota/.test(t))return"chat";
    if(/excel|subir|archivo/.test(t))return"upload";
    if(/contrase|acceso|credencial/.test(t))return"key";
    if(/datos|respaldo/.test(t))return"db";
    return fallback;
  }
  window.PTP={svg,pick};

  /* pestañas */
  function decorateTabs(){
    document.querySelectorAll("nav.tabs button, .tab-btn").forEach(b=>{
      if(b.querySelector(".ico"))return;
      const tn=b.firstChild;if(tn&&tn.nodeType===3)tn.textContent=tn.textContent.replace(/^\+\s*/,"");
      b.insertAdjacentHTML("afterbegin",svg(pick((b.dataset.tab||"")+" "+b.textContent,"dumbbell")));
    });
  }
  /* indicadores */
  function decorateKpis(){
    document.querySelectorAll(".kpi").forEach(k=>{
      if(k.querySelector(".k-ico"))return;
      const lab=(k.querySelector(".k-label")||{}).textContent||"";
      const inner=document.createElement("div");
      while(k.firstChild)inner.appendChild(k.firstChild);
      k.appendChild(inner);
      k.insertAdjacentHTML("afterbegin",`<span class="k-ico">${svg(pick(lab,"trend"),"lg")}</span>`);
    });
  }
  /* tarjetas con título → secciones desplegables */
  function decorateCards(root){
    (root||document).querySelectorAll(".card").forEach(c=>{
      if(c.classList.contains("acc")&&!c.querySelector(":scope>.acc-body"))c.classList.remove("acc","closed");
      if(c.classList.contains("acc")||c.classList.contains("click")||c.closest("nav"))return;
      const h=c.firstElementChild;
      if(!h||h.tagName!=="H3"||c.children.length<2)return;
      const k=pick(h.textContent,null);
      if(k&&!h.querySelector(".ico"))h.insertAdjacentHTML("afterbegin",svg(k));
      const body=document.createElement("div");body.className="acc-body";
      const inner=document.createElement("div");body.appendChild(inner);
      while(h.nextSibling)inner.appendChild(h.nextSibling);
      c.appendChild(body);c.classList.add("acc");
      h.setAttribute("role","button");h.tabIndex=0;h.setAttribute("aria-expanded","true");
      const tog=()=>{const closed=c.classList.toggle("closed");h.setAttribute("aria-expanded",String(!closed))};
      h.addEventListener("click",e=>{if(e.target.closest("button,a,input,select,textarea,label"))return;tog()});
      h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});
    });
  }
  /* líneas verdes animadas del encabezado */
  function headerLines(){
    const h=document.querySelector("header.top, header.topbar");
    if(!h||h.querySelector(".hdr-lines"))return;
    h.insertAdjacentHTML("afterbegin",'<svg class="hdr-lines" viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 200 C 220 120, 420 250, 640 170 S 1020 90, 1240 150"/><path d="M-20 230 C 260 170, 460 260, 700 205 S 1040 140, 1240 190"/><path d="M-20 60 C 300 110, 520 10, 820 70 S 1100 40, 1240 20"/></svg>');
  }
  let raf=0;
  function run(){raf=0;decorateTabs();decorateKpis();decorateCards();}
  function boot(){
    headerLines();run();
    if(!document.querySelector(".ptp-foot"))document.body.insertAdjacentHTML("beforeend",'<div class="ptp-foot">Plataforma <span class="ptp"><b>P</b>ro<b>T</b>rainer<b>P</b>lus</span></div>');
    new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
