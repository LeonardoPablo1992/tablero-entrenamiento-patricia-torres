<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de Entrenamiento — Martha Patricia Torres Gómez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --accent: #e0975a;
    --accent-soft: #f3cba0;
    --accent-dark: #b8672c;
    --accent-light: #fdf1e4;
    --ink: #7a5a3f;
    --muted: #ac9280;
    --bg: #fbfaf9;
    --card: #ffffff;
    --border: #efe6df;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Red Hat Display', Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header.topbar { background: #2e2118; color: #fff; padding: 28px 32px 0 32px; }
  .topbar-inner { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .brand h1 { margin: 0 0 4px 0; font-size: 26px; font-weight: 800; color: var(--accent-soft); letter-spacing: 0.2px; }
  .brand p { margin: 0 0 20px 0; color: var(--accent-soft); opacity: .85; font-size: 14px; }
  .week-chip { background: var(--accent); color: #2e2118; padding: 9px 18px; border-radius: 999px; margin-bottom: 20px; font-size: 13px; font-weight: 800; letter-spacing: 0.2px; white-space: nowrap; }
  nav.tabs { max-width: 1200px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; border-bottom: none; }
  nav.tabs button { font-family: 'Red Hat Display', Arial, sans-serif; background: transparent; border: none; color: var(--accent-soft); opacity: .75; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; transition: background .15s, color .15s, opacity .15s; }
  nav.tabs button:hover { background: rgba(255,255,255,0.06); opacity: 1; }
  nav.tabs button.active { background: var(--bg); color: var(--accent-dark); opacity: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 32px 60px 32px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to {opacity: 1; transform: translateY(0);} }
  h2.section-title { color: var(--accent-dark); font-size: 22px; font-weight: 800; margin: 0 0 4px 0; }
  p.section-sub { color: var(--muted); margin: 0 0 24px 0; font-size: 14px; }
  h3.card-title { color: var(--accent-dark); font-size: 15px; font-weight: 700; margin: 0 0 14px 0; text-transform: uppercase; letter-spacing: 0.4px; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .kpi-card .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .kpi-card .value { font-size: 22px; font-weight: 800; color: var(--accent-dark); line-height: 1.3; }
  .kpi-card .value span.unit { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .panel-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 900px) { .panel-row { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); margin-bottom: 20px; }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.small { height: 220px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data-table th { text-align: left; padding: 10px 10px; background: var(--accent-light); color: var(--accent-dark); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid var(--accent); white-space: nowrap; }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--ink); vertical-align: top; }
  table.data-table tr:hover td { background: #fbf8fc; }
  table.data-table td.dash { color: #c9c2ce; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .badge.rezagado { background: var(--accent); color: #fff; }
  .badge.principal { background: #ece2d8; color: #7a5a3f; }
  .badge.complementarios { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { font-family: 'Red Hat Display', Arial, sans-serif; border: 1px solid var(--border); background: #fff; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day-btn { font-family: 'Red Hat Display', Arial, sans-serif; border: 1.5px solid var(--accent); background: #fff; color: var(--accent-dark); padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .day-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .table-scroll { overflow-x: auto; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .warn-note { font-size: 12px; color: #9a5a3a; margin-top: 10px; line-height: 1.5; background: #fdf1e9; border: 1px solid #f0d6bf; border-radius: 8px; padding: 8px 12px; }
  .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .meal-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .meal-card .mtype { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--accent-dark); margin-bottom: 4px; }
  .meal-card .mtitle { font-weight: 800; color: var(--ink); font-size: 14.5px; margin-bottom: 8px; }
  .meal-card ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.6; color: var(--ink); }
  .snack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .snack-chip { background: var(--accent-light); color: var(--accent-dark); font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
  .check-list { list-style: none; margin: 0; padding: 0; }
  .check-list li { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--ink); padding: 6px 0; border-bottom: 1px solid var(--border); }
  .check-list li:last-child { border-bottom: none; }
  .check-list li::before { content: "✔"; color: var(--accent-dark); font-weight: 700; flex-shrink: 0; }
  .goal-list { list-style: none; margin: 0; padding: 0; }
  .goal-list li { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--ink); padding: 6px 0; }
  .goal-list li::before { content: "🎯"; flex-shrink: 0; }
  footer.page-footer { text-align: center; padding: 26px 20px 34px 20px; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; border-top: 1px solid var(--border); margin-top: 10px; }
  footer.page-footer span { color: var(--accent-dark); }
  footer.page-footer img.footer-logo { display: block; margin: 0 auto 12px auto; max-width: 220px; width: 100%; height: auto; }
  .attribution { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
</style>
</head>

const TAB_ORDER = ["resumen", "nutricion", ...Object.keys(DATA.days)];
const TAB_LABELS = { "resumen": "Resumen General", "nutricion": "Plan de Nutrición" };
Object.keys(DATA.days).forEach(k => TAB_LABELS[k] = k);

function catClass(cat) {
  if (!cat) return 'principal';
  const c = cat.toLowerCase();
  if (c.includes('rezagad')) return 'rezagado';
  if (c.includes('complement')) return 'complementarios';
  return 'principal';
}
function catLabel(cat) {
  if (!cat) return '-';
  const c = cat.toLowerCase();
  if (c.includes('rezagad')) return 'Músculo rezagado';
  if (c.includes('complement')) return 'Complementario';
  return 'Músculo principal';
}
function fmtVal(v) {
  if (v === null || v === undefined || v === '' || v === '-') return '<span class="dash">-</span>';
  return v;
}
function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, ''); }

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  TAB_ORDER.forEach((key, i) => {
    const btn = document.createElement('button');
    btn.textContent = TAB_LABELS[key];
    btn.dataset.tab = key;
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => switchTab(key));
    nav.appendChild(btn);
  });
}
function switchTab(key) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + safeId(key)));
}

// ---------- Resumen ----------
function renderResumen(container) {
  const panel = document.createElement('div');
  panel.className = 'tab-panel active';
  panel.id = 'panel-resumen';

  const dayNames = Object.keys(DATA.days);
  let totalExercises = 0;
  const daySeries = dayNames.map(name => {
    const d = DATA.days[name];
    totalExercises += d.exercises.length;
    return d.exercises.reduce((a, e) => a + (typeof e.series === 'number' ? e.series : 0), 0);
  });
  const totalSetsAll = daySeries.reduce((a,b) => a+b, 0);
  const nm = DATA.nutrition.meta;

  panel.innerHTML = `
    <h2 class="section-title">Resumen General</h2>
    <div class="grid-cards">
      <div class="kpi-card"><div class="label">Días de entrenamiento</div><div class="value">${dayNames.length}<span class="unit">días/semana</span></div></div>
      <div class="kpi-card"><div class="label">Ejercicios en el programa</div><div class="value">${totalExercises}<span class="unit">ejerc.</span></div></div>
      <div class="kpi-card"><div class="label">Series totales / semana</div><div class="value">${totalSetsAll}<span class="unit">series</span></div></div>
      <div class="kpi-card"><div class="label">Nutrición a cargo de</div><div class="value" style="font-size:16px">${nm.profesional}</div></div>
    </div>
    <div class="card">
      <h3 class="card-title">Series por día de entrenamiento</h3>
      <div class="chart-wrap"><canvas id="chartResumenDays"></canvas></div>
    </div>
    <div class="card">
      <h3 class="card-title">Días del programa</h3>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Día</th><th>Ejercicios</th><th>Series</th><th>Reps totales</th></tr></thead>
          <tbody>
            ${dayNames.map(name => {
              const d = DATA.days[name];
              const totalReps = d.exercises.reduce((a,e)=>a+(typeof e.reps === 'number' ? e.reps : 0),0);
              const totalSets = d.exercises.reduce((a,e)=>a+(typeof e.series === 'number' ? e.series : 0),0);
              return `<tr><td><strong>${name}</strong></td><td>${d.exercises.length}</td><td>${totalSets}</td><td>${totalReps}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  container.appendChild(panel);

  new Chart(document.getElementById('chartResumenDays'), {
    type: 'bar',
    data: { labels: dayNames, datasets: [{ label: 'Series', data: daySeries, backgroundColor: '#e0975a', borderRadius: 6, maxBarThickness: 46 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f0ebf2' } }, x: { grid: { display: false } } } }
  });
}

  panel.innerHTML = `
    <h2 class="section-title">Plan de Nutrición</h2>
    <p class="section-sub">Plan de alimentación de 6 días con opciones de desayuno, almuerzo, comida y cena. Elaborado por ${m.profesional} (${m.cedula}) &middot; ${m.fecha}.</p>
    <div class="card">
      <h3 class="card-title">Menú por día</h3>
      <div class="day-tabs" id="nutriDayTabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
        ${n.meals_by_day.map((d,i) => `<button class="day-btn${i===0?' active':''}" data-day="${d.dia}">Día ${d.dia}</button>`).join('')}
      </div>
      <div id="nutriDayContent"></div>
    </div>
    <div class="card">
      <h3 class="card-title">Colaciones (elegir una por ocasión)</h3>
      <div class="snack-grid">${n.colaciones.map(c => `<div class="snack-chip">${c}</div>`).join('')}</div>
      <p class="note">${n.colaciones_nota}</p>
    </div>
    <div class="panel-row">
      <div class="card">
        <h3 class="card-title">Recomendaciones generales</h3>
        <ul class="check-list">${n.recomendaciones.map(r => `<li>${r}</li>`).join('')}</ul>
      </div>
      <div>
        <div class="card">
          <h3 class="card-title">Metas</h3>
          <ul class="goal-list">${n.metas.map(g => `<li>${g}</li>`).join('')}</ul>
        </div>
        <div class="card">
          <h3 class="card-title">Equivalencias de medida</h3>
          <ul class="check-list">${n.medidas.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="card">
          <h3 class="card-title">Plan elaborado por</h3>
          <p class="attribution">${m.profesional}<br>${m.cedula}<br>${m.clinica}<br>Tel: ${m.telefono}<br>Vigente desde: ${m.fecha}</p>
        </div>
      </div>
    </div>
  `;
  container.appendChild(panel);

  function renderDay(diaNum) {
    const d = n.meals_by_day.find(x => x.dia === diaNum);
    const content = document.getElementById('nutriDayContent');
    const order = [['desayuno','Desayuno'],['almuerzo','Almuerzo'],['comida','Comida'],['cena','Cena']];
    content.innerHTML = `<div class="meal-grid">${order.map(([key,label]) => {
      const m = d[key];
      return `<div class="meal-card">
        <div class="mtype">${label}</div>
        <div class="mtitle">${m.titulo}</div>
        <ul>${m.items.map(it => `<li>${it}</li>`).join('')}</ul>
      </div>`;
    }).join('')}</div>`;
  }
  renderDay(1);

  document.getElementById('nutriDayTabs').querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#nutriDayTabs .day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDay(parseInt(btn.dataset.day, 10));
    });
  });
}

// ---------- Dia de entrenamiento ----------
function renderDay(container, name) {
  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.id = 'panel-' + safeId(name);
  const d = DATA.days[name];
  const totalSets = d.exercises.reduce((a,e)=>a+(typeof e.series === 'number' ? e.series : 0),0);
  const totalReps = d.exercises.reduce((a,e)=>a+(typeof e.reps === 'number' ? e.reps : 0),0);

  panel.innerHTML = `
    <h2 class="section-title">${name}</h2>
    <p class="section-sub">${d.subtitulo}</p>
    <div class="card">
      <div class="filter-bar" id="filterBar-${safeId(name)}">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="rezagado">Músculo rezagado</button>
        <button class="filter-btn" data-filter="principal">Músculo principal</button>
        <button class="filter-btn" data-filter="complementarios">Complementarios</button>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Categoría</th><th>Combo</th><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Tempo</th><th>RIR</th><th>Descanso</th></tr></thead>
          <tbody id="tbody-${safeId(name)}"></tbody>
        </table>
      </div>
      ${d.nota_extra ? `<p class="warn-note">${d.nota_extra}</p>` : ''}
    </div>
    <div class="card">
      <h3 class="card-title">Series por categoría</h3>
      <div class="chart-wrap small"><canvas id="chart-${safeId(name)}"></canvas></div>
      <p class="note">El bloque de <strong>músculo rezagado</strong> se mantiene completo todos los días por prioridad de frecuencia, según indicación del coach. Total de la sesión: ${totalSets} series / ${totalReps} reps.</p>
    </div>
  `;
  container.appendChild(panel);

  let currentFilter = 'all';
  function renderRows() {
    const tbody = document.getElementById('tbody-' + safeId(name));
    const rows = d.exercises.filter(e => currentFilter === 'all' || catClass(e.categoria) === currentFilter);
    tbody.innerHTML = rows.map(e => `
      <tr>
        <td><span class="badge ${catClass(e.categoria)}">${catLabel(e.categoria)}</span></td>
        <td>${fmtVal(e.combo)}</td>
        <td><strong>${e.ejercicio}</strong></td>
        <td>${fmtVal(e.series)}</td>
        <td>${fmtVal(e.reps)}</td>
        <td>${fmtVal(e.tempo)}</td>
        <td>${fmtVal(e.rir)}</td>
        <td>${fmtVal(e.rest)}</td>
      </tr>`).join('');
  }
  renderRows();

  const filterBar = document.getElementById('filterBar-' + safeId(name));
  filterBar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderRows();
    });
  });

  const cats = ['Musculo Rezagado', 'Musculo principal', 'Complementarios'];
  const catData = cats.map(c => d.exercises.filter(e => e.categoria === c).reduce((a,e)=>a+(typeof e.series === 'number' ? e.series : 0),0));
  new Chart(document.getElementById('chart-' + safeId(name)), {
    type: 'doughnut',
    data: { labels: ['Rezagado', 'Principal', 'Complementarios'], datasets: [{ data: catData, backgroundColor: ['#e0975a', '#b8672c', '#f3cba0'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Red Hat Display' } } } } }
  });
}

// ---------- Init ----------
function init() {
  buildTabs();
  const main = document.getElementById('mainContent');
  renderResumen(main);
  renderNutricion(main);
  Object.keys(DATA.days).forEach(name => renderDay(main, name));
}
init();
</script>
